services:
  postgres:
    image: postgres:17-alpine
    profiles: ["docker-db"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: land_registry
      POSTGRES_USER: land_registry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup:env first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U land_registry -d land_registry"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?Run npm run setup:env first}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?Run npm run setup:env first}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
      - ./infra/minio-cors.json:/config/minio-cors.json:ro

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >-
      /bin/sh -c 'until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done;
      mc mb --ignore-existing local/land-registry-private;
      mc cors set local/land-registry-private /config/minio-cors.json;
      mc anonymous set none local/land-registry-private'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?Run npm run setup:env first}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?Run npm run setup:env first}
    volumes:
      - ./infra/minio-cors.json:/config/minio-cors.json:ro

volumes:
  postgres_data:
  minio_data: